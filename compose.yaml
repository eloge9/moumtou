
services:
###> doctrine/doctrine-bundle ###
  # MOUMTOU utilise MySQL (voir DATABASE_URL dans .env / .env.example) : ce
  # service Docker est un moyen optionnel et pratique d'avoir un MySQL local
  # sans l'installer sur la machine — il ne remplace pas MySQL par autre
  # chose. Le mot de passe par défaut ci-dessous doit être changé en
  # production (via un fichier .env.local, jamais commité).
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moumtou}
      # Changez impérativement ce mot de passe en production.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
      # Vous pouvez utiliser un répertoire monté à la place, pour ne jamais
      # perdre vos données même en supprimant le volume par erreur :
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
