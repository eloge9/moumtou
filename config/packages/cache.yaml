framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Données de référence publiques peu modifiées (cahier des
            # charges — FONCTIONNALITÉ 17 §15) : domaines, mentions,
            # spécialités, technologies, pays des établissements.
            cache.reference_data: null
            # Anti-tempête d'alertes (cahier des charges — FONCTIONNALITÉ 18
            # §34) : une clé par "signature" d'erreur critique, avec TTL —
            # tant qu'une entrée existe, aucune nouvelle alerte n'est envoyée
            # pour la même erreur.
            cache.error_alerts: null

when@test:
    framework:
        cache:
            # Le compteur de rate limiting (inscription/login/commentaires) doit
            # repartir de zéro à chaque exécution de la suite de tests, sinon des
            # exécutions répétées dans la même heure peuvent déclencher le
            # plafond entre deux lancements distincts de PHPUnit. Même
            # raisonnement pour le cache de données de référence et le
            # cooldown des alertes : sans cela, un test verrait un état
            # périmé provenant d'une exécution précédente.
            pools:
                cache.rate_limiter:
                    adapter: cache.adapter.array
                cache.reference_data:
                    adapter: cache.adapter.array
                cache.error_alerts:
                    adapter: cache.adapter.array
