framework:
    rate_limiter:
        # Cahier des charges §35 : limiter les abus (inscriptions/commentaires en masse).
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        comment:
            policy: sliding_window
            limit: 15
            interval: '1 hour'
        # Cahier des charges — FONCTIONNALITÉ 7 §24 : limiter les demandes de
        # contact recruteur → talent pour éviter le spam de masse.
        contact_request:
            policy: sliding_window
            limit: 20
            interval: '1 day'
        # Cahier des charges — FONCTIONNALITÉ 15 §13 : un signalement mobilise
        # un administrateur, contrairement à un commentaire ; limite plus
        # stricte pour empêcher un harcèlement par signalements en masse.
        report:
            policy: sliding_window
            limit: 10
            interval: '1 day'
