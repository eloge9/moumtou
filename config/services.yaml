# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.project_uploads_directory: '%kernel.project_dir%/public/uploads/projects'
    app.avatar_uploads_directory: '%kernel.project_dir%/public/uploads/avatars'
    app.institution_logo_uploads_directory: '%kernel.project_dir%/public/uploads/institutions'
    app.recruiter_logo_uploads_directory: '%kernel.project_dir%/public/uploads/recruiters'

    # Limites d'upload des médias/preuves de projet (cahier des charges —
    # FONCTIONNALITÉ 10 §4) : centralisées ici plutôt que dispersées en
    # constantes dans chaque service/formulaire, pour rester facilement
    # modifiables sans toucher au code.
    app.project_photo_max_size: '5M'
    app.project_photo_max_count: 8
    app.project_document_max_size: '10M'
    app.project_document_max_count: 5

    # Sauvegarde/restauration (cahier des charges — FONCTIONNALITÉ 16 §6/§24) :
    # uniquement des réglages de rétention/activation, jamais un secret.
    app.backup_enabled: '%env(bool:BACKUP_ENABLED)%'
    app.backup_path: '%kernel.project_dir%/var/backups'
    app.backup_retention_daily: '%env(int:BACKUP_RETENTION_DAILY)%'
    app.backup_retention_weekly: '%env(int:BACKUP_RETENTION_WEEKLY)%'
    app.backup_retention_monthly: '%env(int:BACKUP_RETENTION_MONTHLY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\ProjectPhotoUploader:
        arguments:
            $projectUploadsDirectory: '%app.project_uploads_directory%'
            $maxPhotos: '%app.project_photo_max_count%'

    App\Service\ProjectDocumentUploader:
        arguments:
            $projectUploadsDirectory: '%app.project_uploads_directory%'
            $maxDocuments: '%app.project_document_max_count%'

    App\Form\PublishProjectType:
        arguments:
            $projectPhotoMaxSize: '%app.project_photo_max_size%'
            $projectPhotoMaxCount: '%app.project_photo_max_count%'
            $projectDocumentMaxSize: '%app.project_document_max_size%'
            $projectDocumentMaxCount: '%app.project_document_max_count%'

    App\Service\AvatarUploader:
        arguments:
            $avatarUploadsDirectory: '%app.avatar_uploads_directory%'

    App\Service\InstitutionLogoUploader:
        arguments:
            $institutionLogoUploadsDirectory: '%app.institution_logo_uploads_directory%'

    App\Service\RecruiterLogoUploader:
        arguments:
            $recruiterLogoUploadsDirectory: '%app.recruiter_logo_uploads_directory%'

    App\Service\Backup\DatabaseBackupService:
        arguments:
            $backupPath: '%app.backup_path%'
            $environment: '%kernel.environment%'

    App\Service\Backup\MediaBackupService:
        arguments:
            $backupPath: '%app.backup_path%'
            $environment: '%kernel.environment%'
            $projectUploadsDirectory: '%app.project_uploads_directory%'
            $avatarUploadsDirectory: '%app.avatar_uploads_directory%'
            $institutionLogoUploadsDirectory: '%app.institution_logo_uploads_directory%'
            $recruiterLogoUploadsDirectory: '%app.recruiter_logo_uploads_directory%'

    App\Service\Backup\BackupHistoryLogger:
        arguments:
            $backupPath: '%app.backup_path%'

    App\Command\BackupDatabaseCommand:
        arguments:
            $backupEnabled: '%app.backup_enabled%'
            $retentionDaily: '%app.backup_retention_daily%'
            $retentionWeekly: '%app.backup_retention_weekly%'
            $retentionMonthly: '%app.backup_retention_monthly%'

    App\Command\BackupMediaCommand:
        arguments:
            $backupEnabled: '%app.backup_enabled%'
            $retentionDaily: '%app.backup_retention_daily%'
            $retentionWeekly: '%app.backup_retention_weekly%'
            $retentionMonthly: '%app.backup_retention_monthly%'

    App\Command\BackupFullCommand:
        arguments:
            $backupPath: '%app.backup_path%'
            $environment: '%kernel.environment%'
            $backupEnabled: '%app.backup_enabled%'
            $retentionDaily: '%app.backup_retention_daily%'
            $retentionWeekly: '%app.backup_retention_weekly%'
            $retentionMonthly: '%app.backup_retention_monthly%'

    App\Command\RestoreMediaCommand:
        arguments:
            $uploadsRootDirectory: '%kernel.project_dir%/public/uploads'

    App\Security\OAuth\OAuthProviderRegistry:
        arguments:
            $googleClientId: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            $googleClientSecret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'
            $facebookClientId: '%env(FACEBOOK_OAUTH_CLIENT_ID)%'
            $facebookClientSecret: '%env(FACEBOOK_OAUTH_CLIENT_SECRET)%'
            $linkedinClientId: '%env(LINKEDIN_OAUTH_CLIENT_ID)%'
            $linkedinClientSecret: '%env(LINKEDIN_OAUTH_CLIENT_SECRET)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
